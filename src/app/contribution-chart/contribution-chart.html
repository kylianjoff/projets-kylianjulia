<div class="w-[95%] max-w-[1400px] p-8 bg-white rounded-[15px] shadow-[0_4px_15px_rgba(159,0,177,0.15)] my-8 mx-auto border-2 border-[#e0e0e0] transition-all duration-300 overflow-hidden hover:shadow-[0_6px_20px_rgba(159,0,177,0.25)] hover:border-[#9f00b1]">

  <!-- Loading -->
  <div *ngIf="loading" class="flex flex-col justify-center items-center min-h-[250px] gap-4">
    <div class="w-[50px] h-[50px] border-4 border-[#f3f3f3] border-t-[#9f00b1] rounded-full animate-spin"></div>
    <p class="text-base text-[#666] m-0">Chargement des contributions...</p>
  </div>

  <!-- Erreur -->
  <div *ngIf="error && !loading" class="flex flex-col justify-center items-center min-h-[250px] gap-4">
    <p class="text-base text-[#d32f2f] font-medium m-0">❌ Impossible de charger les contributions</p>
    <button (click)="loadContributions()"
      class="px-5 py-2.5 bg-[#9f00b1] text-white border-none rounded-lg text-sm cursor-pointer transition-all duration-300 hover:bg-[#7d008d] hover:-translate-y-0.5 hover:shadow-[0_4px_12px_rgba(159,0,177,0.4)]">
      Réessayer
    </button>
  </div>

  <!-- Heatmap -->
  <div *ngIf="!loading && !error && contributionData" class="w-full">
    <h3 class="m-0 mb-6 text-lg text-[#666] font-normal">
      {{ contributionData.totalCommits }} contributions au cours de la dernière année
    </h3>

    <div class="heatmap flex gap-2.5 py-2.5 w-full overflow-x-auto overflow-y-hidden">
      <!-- Jours de la semaine -->
      <div class="grid grid-rows-[repeat(7,14px)] gap-[3px] pt-6 shrink-0">
        <span class="text-[11px] text-[#666] text-right pr-2 leading-[14px]">Lun</span>
        <span class="text-[11px] text-[#666] text-right pr-2 leading-[14px]"></span>
        <span class="text-[11px] text-[#666] text-right pr-2 leading-[14px]">Mer</span>
        <span class="text-[11px] text-[#666] text-right pr-2 leading-[14px]"></span>
        <span class="text-[11px] text-[#666] text-right pr-2 leading-[14px]">Ven</span>
        <span class="text-[11px] text-[#666] text-right pr-2 leading-[14px]"></span>
        <span class="text-[11px] text-[#666] text-right pr-2 leading-[14px]"></span>
      </div>

      <!-- Grille des mois -->
      <div class="flex gap-[3px] shrink-0">
        <div *ngFor="let month of months" class="flex flex-col gap-[3px] shrink-0">
          <div class="text-[12px] text-[#666] h-5 text-left whitespace-nowrap">
            {{ month.name.split(' ')[0].substring(0, 3) }}
          </div>
          <div class="grid grid-rows-[repeat(7,14px)] grid-flow-col gap-[3px]">
            <div
              *ngFor="let day of month.days"
              class="w-[14px] h-[14px] rounded-[3px] cursor-pointer transition-all duration-200 border border-black/[0.06] hover:border-[rgba(159,0,177,0.8)] hover:scale-[1.4] hover:z-10 hover:shadow-[0_2px_8px_rgba(159,0,177,0.4)]"
              [style.background-color]="getContributionColor(day.count)"
              [style.grid-row]="day.dayOfWeek === 0 ? 7 : day.dayOfWeek"
              [title]="day.count + ' contribution(s) le ' + day.date.toLocaleDateString('fr-FR')">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Légende -->
    <div class="flex items-center gap-2.5 mt-5 justify-end text-[13px] text-[#666] flex-wrap">
      <span>Moins</span>
      <div class="flex gap-[3px]">
        <div class="w-3 h-3 rounded-[2px] border border-black/[0.06]" [style.background-color]="getContributionColor(0)"></div>
        <div class="w-3 h-3 rounded-[2px] border border-black/[0.06]" [style.background-color]="getContributionColor(3)"></div>
        <div class="w-3 h-3 rounded-[2px] border border-black/[0.06]" [style.background-color]="getContributionColor(7)"></div>
        <div class="w-3 h-3 rounded-[2px] border border-black/[0.06]" [style.background-color]="getContributionColor(15)"></div>
        <div class="w-3 h-3 rounded-[2px] border border-black/[0.06]" [style.background-color]="getContributionColor(25)"></div>
      </div>
      <span>Plus</span>
    </div>
  </div>
</div>
